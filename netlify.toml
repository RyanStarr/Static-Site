[build]
publish = "public"
# $URL is the project's primary address, so links and canonical tags always match
# the domain the build is actually served from (the *.netlify.app test project, or
# ryanstarr.co.uk once the domain is attached).
command = "zola build --base-url $URL"

[build.environment]
# Match the version used locally (`zola --version`).
ZOLA_VERSION = "0.23.6"

[context.deploy-preview]
command = "zola build --base-url $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "zola build --base-url $DEPLOY_PRIME_URL"

# No www/apex redirect here on purpose. Netlify already redirects every other
# domain on the project to its primary domain (currently www.ryanstarr.co.uk);
# a rule here pointing the other way would create a redirect loop.

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "DENY"
  Strict-Transport-Security = "max-age=31536000"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# style.css is linked with a ?h=<hash> cachebust query (see base.html), so the
# URL changes whenever the file does and a year-long immutable cache is safe.
[[headers]]
for = "/style.css"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts. Rename the file if a font is ever updated.
[[headers]]
for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
