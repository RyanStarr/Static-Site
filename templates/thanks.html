{% extends "base.html" %}

{#- Where the contact form lands after Netlify accepts a submission. -#}
{% block content %}
<article class="page">
  <div class="wrap wrap--narrow">
    <header class="page__header">
      <p class="label">Contact</p>
      <h1 class="page__title">{{ page.title }}</h1>
    </header>
    <div class="prose">{{ page.content | safe }}</div>
    <p class="actions">
      <a class="btn" href="{{ get_url(path='/') }}">Back to home</a>
      <a class="btn btn--quiet" href="{{ get_url(path='/about/') }}">CV</a>
    </p>
  </div>
</article>
{% endblock %}
