{% extends "base.html" %}

{% block content %}
<article class="page">
  <div class="wrap wrap--narrow">
    <header class="page__header">
      <h1 class="page__title">{{ page.title }}</h1>
      {%- if page.extra.lede %}<p class="page__lede">{{ page.extra.lede }}</p>{% endif %}
      {%- if page.extra.dated and page.date %}
      <p class="label"><time datetime="{{ page.date }}">{{ page.date | date(format='%-d %B %Y') }}</time></p>
      {%- endif %}
    </header>
    <div class="prose">{{ page.content | safe }}</div>
  </div>
</article>
{% endblock %}
